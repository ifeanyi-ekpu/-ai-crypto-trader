mode: paper
kill_switch: false
exchange: local_sample
symbols:
  - BTC/USD
  - ETH/USD
  - SOL/USD
paper_equity_usd: 10000
risk:
  max_risk_per_trade_pct: 0.25
  max_daily_loss_pct: 1.5
  max_open_positions: 1
  max_consecutive_losses: 3
  min_net_reward_risk_ratio: 2.0
  require_stop_loss: true
  require_take_profit: true
  allow_leverage: false
strategy:
  name: trend_breakout
  entry_timeframe: 5m
  trend_timeframe: 1h
execution:
  fee_pct: 0.4        # simulated exchange taker fee per side, in percent
  slippage_bps: 5     # applied against us on entries and stop exits
ai:
  enabled: true
  provider: ollama
  model: qwen3:8b

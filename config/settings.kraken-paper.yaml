mode: paper
kill_switch: false
exchange: kraken
symbols:
  - BTC/USD
  - ETH/USD
  - SOL/USD
paper_equity_usd: 10000
risk:
  max_risk_per_trade_pct: 0.25
  max_daily_loss_pct: 1.5
  max_open_positions: 1
  max_consecutive_losses: 3
  min_net_reward_risk_ratio: 2.0
  require_stop_loss: true
  require_take_profit: true
  allow_leverage: false
strategy:
  name: trend_breakout
  entry_timeframe: 15m
  trend_timeframe: 1h
  fast_ema: 20
  slow_ema: 50
  breakout_window: 20
  atr_period: 14
  stop_atr_multiple: 1.5
  target_atr_multiple: 12.0
execution:
  fee_pct: 0.4        # Kraken spot taker fee per side, base tier
  slippage_bps: 5     # applied against us on entries and stop exits
ai:
  enabled: true
  provider: ollama
  model: qwen3:8b
